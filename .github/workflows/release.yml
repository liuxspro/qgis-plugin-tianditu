name: "Release"

on:
  push:
    tags:
      - "v*"

env:
  # lxml (via owslib) has no cp315 wheels yet; pin a version QGIS supports.
  UV_PYTHON: "3.12"

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6

      - name: Check version matches tag
        run: python3 ./scripts/version.py check --tag "$GITHUB_REF_NAME"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: "Build and Pack"
        run: just pack

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} ./dist/*.zip -t "Release ${{ github.ref_name }}" --generate-notes -d
